# Deep link flow
# Flow: launch → open deep link → navigate to send

appId: com.veilpay.consumer
---
- openLink: "veilpay://send?address=0x2222222222222222222222222222222222222222&amount=1.5"
- assertVisible: "Send Payment"
- assertVisible:
    text: "0x2222222222222222222222222222222222222222"
- assertVisible: "1.5"
