# L1 fix: removed deprecated `version` key (obsolete in modern Docker Compose)
# L2 fix: added Redis password requirement

services:
  postgres:
    image: postgres:16-alpine
    container_name: veilpay-postgres
    environment:
      POSTGRES_USER: veilpay
      POSTGRES_PASSWORD: veilpay_dev_password
      POSTGRES_DB: veilpay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veilpay"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: veilpay-redis
    # L2 fix: password-protected Redis. Set REDIS_PASSWORD in your .env for production.
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          redis-server --requirepass "$$REDIS_PASSWORD"
        else
          redis-server
        fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  healthcheck:
    # Fix: use redis-cli with -a flag when password is set
    test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping"]
    interval: 10s
    timeout: 5s
    retries: 5

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: veilpay-anvil
    entrypoint: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337"]
    ports:
      - "8545:8545"
    environment:
      - ANVIL_IP_ADDR=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "cast block-number --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: veilpay-network
