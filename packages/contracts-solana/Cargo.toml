[package]
name = "veil_pool"
version = "0.1.0"
description = "VeilPay Privacy Pool for Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "veil_pool"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = { version = "0.30.1", features = ["token"] }

[dev-dependencies]
anchor-client = "0.30.1"
