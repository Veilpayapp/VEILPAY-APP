# Onboarding flow (UX-002)
# Flow: cold launch → welcome → get started → wallet connect (create/import)
#
# Selectors use accessibility labels + testIDs wired in the consumer app.
# Requires a clean install (or clearState) so Onboarding is the first screen.

appId: com.veilpay.consumer
---
- launchApp:
    clearState: true
- assertVisible: "PRIVATE PAYMENTS"
- assertVisible:
    id: "onboarding-get-started"
- tapOn:
    id: "onboarding-get-started"
- assertVisible: "CHOOSE CONNECTION METHOD"
- assertVisible:
    id: "wallet-connect-create"
- assertVisible:
    id: "wallet-connect-import"
- tapOn:
    id: "wallet-connect-create"
- assertVisible:
    text: ".*CREATE.*|.*recovery.*|.*seed.*|.*phrase.*"
