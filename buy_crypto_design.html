<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

            background-color: #050505;

<body class="text-on-surface antialiased pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#050505] border-b-2 border-[#131313] shadow-[4px_4px_0px_0px_rgba(245,158,11,1)] flex items-center justify-between px-6 h-16 w-full">
<button class="active:translate-y-[2px] active:translate-x-[2px] active:shadow-none transition-all">
<span class="material-symbols-outlined text-[#F59E0B]" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Space_Grotesk'] uppercase tracking-[0.1em] font-bold text-[#F59E0B]">BUY CRYPTO</h1>
<div class="w-6"></div> <!-- Spacer for center alignment -->
</header>
<main class="mt-24 px-4 space-y-8 max-w-lg mx-auto">
<!-- Fiat Input Section -->
<section class="space-y-4">
<label class="text-on-surface-variant text-xs font-bold tracking-[0.15em]">YOU PAY</label>
<div class="bg-surface-container-lowest border-2 border-surface-container-highest p-6 rounded-lg relative">
<div class="flex flex-col items-center gap-4">
<input class="bg-transparent border-none text-center font-mono text-5xl font-black text-on-surface w-full focus:ring-0" type="text" value="$500.00"/>
<div class="flex gap-2 overflow-x-auto pb-2 w-full justify-center">
<button class="bg-[#F59E0B] text-on-primary font-bold px-4 py-1 rounded-full border-2 border-black neopop-shadow-sm text-xs">USD</button>
<button class="bg-surface-container-high text-on-surface px-4 py-1 rounded-full border-2 border-black text-xs font-bold">EUR</button>
<button class="bg-surface-container-high text-on-surface px-4 py-1 rounded-full border-2 border-black text-xs font-bold">GBP</button>
<button class="bg-surface-container-high text-on-surface px-4 py-1 rounded-full border-2 border-black text-xs font-bold">INR</button>
</div>
</div>
</div>
<div class="grid grid-cols-3 gap-4">
<button class="bg-surface border-2 border-surface-container-highest py-3 rounded-lg font-bold text-[#F59E0B] neopop-shadow-sm active:translate-y-[2px] active:translate-x-[2px] active:shadow-none transition-all">+$50</button>
<button class="bg-surface border-2 border-surface-container-highest py-3 rounded-lg font-bold text-[#F59E0B] neopop-shadow-sm active:translate-y-[2px] active:translate-x-[2px] active:shadow-none transition-all">+$100</button>
<button class="bg-surface border-2 border-surface-container-highest py-3 rounded-lg font-bold text-[#F59E0B] neopop-shadow-sm active:translate-y-[2px] active:translate-x-[2px] active:shadow-none transition-all">+$200</button>
</div>
</section>
<!-- Estimated Receive -->
<section class="bg-[#131313] border-2 border-[#F59E0B] p-6 rounded-lg neopop-shadow-md">
<label class="text-on-surface-variant text-xs font-bold tracking-[0.15em] block mb-2">YOU RECEIVE</label>
<div class="flex items-end gap-2">
<span class="text-3xl font-mono font-black text-[#F59E0B]">≈ 0.152 ETH</span>
</div>
<div class="flex items-center gap-2 mt-2">
<span class="material-symbols-outlined text-xs text-on-surface-variant" data-icon="hub">hub</span>
<span class="text-on-surface-variant text-sm font-bold uppercase tracking-wider">on Ethereum</span>
</div>
</section>
<!-- Payment Selector -->
<section class="space-y-4">
<label class="text-on-surface-variant text-xs font-bold tracking-[0.15em]">PAYMENT METHOD</label>
<div class="space-y-3">
<!-- Active Method -->
<div class="flex items-center justify-between p-4 bg-surface-container-high border-2 border-[#F59E0B] rounded-lg neopop-shadow-sm">
<div class="flex items-center gap-4">
<div class="bg-primary-container p-2 rounded-lg">
<span class="material-symbols-outlined text-on-primary-container" data-icon="credit_card">credit_card</span>
</div>
<div>
<p class="font-bold text-sm">Credit/Debit Card</p>
<p class="text-[10px] text-on-surface-variant font-bold">INSTANT DELIVERY</p>
</div>
</div>
<div class="w-6 h-6 rounded-full border-4 border-[#F59E0B] bg-black"></div>
</div>

<div class="flex items-center justify-between p-4 bg-surface-container border-2 border-surface-container-highest rounded-lg active:bg-surface-container-high transition-colors">
<div class="flex items-center gap-4">
<div class="bg-surface-container-highest p-2 rounded-lg">
<span class="material-symbols-outlined text-on-surface" data-icon="account_balance_wallet">account_balance_wallet</span>
</div>
<div>
<p class="font-bold text-sm text-on-surface-variant">Google Pay</p>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-surface-container-highest"></div>
</div>
<div class="flex items-center justify-between p-4 bg-surface-container border-2 border-surface-container-highest rounded-lg active:bg-surface-container-high transition-colors">
<div class="flex items-center gap-4">
<div class="bg-surface-container-highest p-2 rounded-lg text-xs font-black px-3">UPI</div>
<div>
<p class="font-bold text-sm text-on-surface-variant">UPI (India)</p>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-surface-container-highest"></div>
</div>
<div class="flex items-center justify-between p-4 bg-surface-container border-2 border-surface-container-highest rounded-lg active:bg-surface-container-high transition-colors">
<div class="flex items-center gap-4">
<div class="bg-surface-container-highest p-2 rounded-lg">
<span class="material-symbols-outlined text-on-surface" data-icon="account_balance">account_balance</span>
</div>
<div>
<p class="font-bold text-sm text-on-surface-variant">Bank Transfer</p>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-surface-container-highest"></div>
</div>
</div>
</section>

<div class="flex justify-between items-center text-xs font-bold uppercase tracking-widest text-on-surface-variant">
<span>Network Fee</span>
<span class="font-mono text-on-surface">$2.50</span>
</div>
<div class="flex justify-between items-center text-xs font-bold uppercase tracking-widest text-on-surface-variant">
<span>Transak Fee (1.5%)</span>
<span class="font-mono text-on-surface">$7.50</span>
</div>
<div class="h-[2px] bg-surface-container-highest"></div>
<div class="flex justify-between items-center font-black">
<span class="text-xs uppercase tracking-[0.2em] text-[#F59E0B]">Total Payable</span>
<span class="font-mono text-xl text-on-surface">$510.00</span>
</div>
</section>

<div class="fixed bottom-0 left-0 w-full p-4 bg-[#050505] z-50">
<button class="w-full bg-[#F59E0B] text-[#472a00] font-black py-5 px-8 rounded-full border-2 border-black neopop-shadow-black flex items-center justify-center gap-4 active:translate-y-[4px] active:translate-x-[4px] active:shadow-none transition-all uppercase tracking-widest text-sm">

</button>
