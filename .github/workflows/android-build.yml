name: Android Build (EAS Backup)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    runs-on: ubuntu-latest
    name: Build Android APK

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: config/.nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Expo
        working-directory: apps/consumer-app
        run: npx -p eas-cli@20 eas --version

      # Stage the withdraw-circuit prover assets (withdraw.wasm,
      # withdraw_final.zkey, snarkjs.min.js/.umd) into
      # apps/consumer-app/assets/circuits/ BEFORE the EAS build: Metro
      # statically requires them (assetExts wasm/zkey/umd) and the release
      # prover is bundled-local with no remote fallback.
      #
      # FAIL-CLOSED: the script verifies every staged byte against the
      # SHA-256 pins baked in apps/consumer-app/src/constants/circuit.ts and
      # exits non-zero on any mismatch, failing this build. It is idempotent
      # (consecutive runs rewrite identical bytes).
      #
      # NOTE (user gate): packages/circuits/build/ is gitignored (root
      # .gitignore `build/`), so a fresh checkout cannot source the pinned
      # wasm/zkey from it. Until the circuit build artifacts are committed or
      # otherwise supplied on the runner, this step fails closed by design —
      # the pins make sure no APK is ever built with wrong or missing prover
      # bytes. See apps/consumer-app/assets/circuits/README.md. The
      # eas-build-post-install hook re-verifies the archived staged assets
      # inside the EAS build itself.
      - name: Stage circuit assets
        working-directory: apps/consumer-app
        run: node scripts/stage-circuit-assets.js

      - name: Build Android APK (EAS local)
        working-directory: apps/consumer-app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          pnpm exec eas build --platform android \
            --local \
            --output=./app-release.apk

      - name: Upload APK to artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: veilpay-android-apk
          path: apps/consumer-app/app-release.apk
          retention-days: 30

      - name: Notify build completion
        if: always()
        run: |
          echo "Build status: ${{ job.status }}"
          echo "APK available in artifacts"
