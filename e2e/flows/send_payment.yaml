# Send payment happy path (UX-002)
# Flow: home → send → recipient + amount → continue
#
# Precondition: a wallet is already onboarded on the device under test
# (do not clearState). Selectors use testIDs + accessibility labels.

appId: com.veilpay.consumer
---
- launchApp
- assertVisible:
    id: "home-action-send"
- tapOn:
    id: "home-action-send"
- assertVisible: "SEND PAYMENT"
- assertVisible:
    id: "send-recipient-input"
- tapOn:
    id: "send-recipient-input"
- inputText: "0x1111111111111111111111111111111111111111"
- assertVisible:
    id: "send-amount-input"
- tapOn:
    id: "send-amount-input"
- inputText: "0.01"
- assertVisible:
    id: "send-continue-button"
