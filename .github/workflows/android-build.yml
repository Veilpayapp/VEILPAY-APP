name: Android Build (EAS Backup)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    runs-on: ubuntu-latest
    name: Build Android APK

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: config/.nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Expo
        working-directory: apps/consumer-app
        run: npx -p eas-cli@20 eas --version

      # Stage the withdraw-circuit prover assets (withdraw.wasm,
      # withdraw_final.zkey, snarkjs.min.js/.umd) into
      # apps/consumer-app/assets/circuits/ BEFORE the EAS build: Metro
      # statically requires them (assetExts wasm/zkey/umd) and the release
      # prover is bundled-local with no remote fallback.
      #
      # FAIL-CLOSED: whichever source path runs, every staged byte is
      # verified against the SHA-256 pins baked in
      # apps/consumer-app/src/constants/circuit.ts and any mismatch exits
      # non-zero, failing this build. Staging is idempotent (consecutive
      # runs rewrite identical bytes).
      #
      # Source resolution, in order:
      #   1. LOCAL: packages/circuits/build/withdraw.wasm +
      #      withdraw_final.zkey present on the runner (a machine that has
      #      compiled the circuit) -> scripts/stage-circuit-assets.js.
      #   2. SUPPLY: artifacts absent -> scripts/supply-circuit-assets.js
      #      fetches the three pinned binaries from the GitHub Actions
      #      repository variable CIRCUIT_ARTIFACTS_URL (set it under
      #      Settings > Secrets and variables > Actions > Variables), e.g.
      #      the download base of a GitHub release:
      #      https://github.com/<owner>/<repo>/releases/download/<tag>
      #      It verifies every downloaded byte against the same baked pins
      #      BEFORE anything is staged, then hands off to the staging
      #      script (which re-verifies at write time; the CDN is not used).
      #      Unset variable, unreachable source, or digest mismatch ->
      #      exit 1 -> this build fails. When NEITHER source works the
      #      build fails closed.
      #
      # ONE-TIME USER ACTION (user gate 7): upload the three binaries
      # (withdraw.wasm, withdraw_final.zkey, snarkjs.min.js) to a GitHub
      # release — or any other pinned https source — and set the repository
      # variable CIRCUIT_ARTIFACTS_URL to its download base URL. The ~10MB
      # of binaries stay OUT of git; the pins baked in
      # apps/consumer-app/src/constants/circuit.ts guarantee the bytes.
      # See docs/reference/circuit-asset-supply.md and
      # apps/consumer-app/assets/circuits/README.md. The
      # eas-build-post-install hook re-verifies the archived staged assets
      # inside the EAS build itself.
      - name: Stage circuit assets (local build, else pinned supply)
        working-directory: apps/consumer-app
        env:
          CIRCUIT_ARTIFACTS_URL: ${{ vars.CIRCUIT_ARTIFACTS_URL }}
        run: |
          if [ -f ../../packages/circuits/build/withdraw.wasm ] && [ -f ../../packages/circuits/build/withdraw_final.zkey ]; then
            echo "local circuit build outputs found — staging from packages/circuits/build"
            node scripts/stage-circuit-assets.js
          else
            echo "no local circuit build outputs — supplying the pinned binaries from CIRCUIT_ARTIFACTS_URL (fail-closed)"
            node scripts/supply-circuit-assets.js
          fi

      - name: Build Android APK (EAS local)
        working-directory: apps/consumer-app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          pnpm exec eas build --platform android \
            --local \
            --output=./app-release.apk

      - name: Upload APK to artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: veilpay-android-apk
          path: apps/consumer-app/app-release.apk
          retention-days: 30

      - name: Notify build completion
        if: always()
        run: |
          echo "Build status: ${{ job.status }}"
          echo "APK available in artifacts"
