name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @veilpay/backend db:generate

      - name: Lint backend
        run: pnpm --filter @veilpay/backend lint

      - name: Typecheck backend
        run: pnpm --filter @veilpay/backend typecheck

      - name: Test backend
        run: pnpm --filter @veilpay/backend test

      - name: Lint indexer
        run: pnpm --filter @veilpay/indexer lint

      - name: Typecheck indexer
        run: pnpm --filter @veilpay/indexer typecheck

      # TEST-004: indexer ships 7 src test suites (config, indexers, websocket,
      # queue, stealth crypto/scanner, webhook dispatcher) but CI previously ran
      # only lint/typecheck, leaving money-path indexing logic unguarded.
      - name: Test indexer
        run: pnpm --filter @veilpay/indexer test

      - name: Lint consumer app
        run: pnpm --filter consumer-app lint

      # A11Y-001: lightweight static gate — primary interactive surfaces should
      # not ship icon-only pressables without accessibility labels. This is a
      # smoke check, not a full WCAG 2.2 AA audit.
      - name: Accessibility smoke (labeled pressables)
        run: |
          set -e
          # Fail if we introduce Pressable/TouchableOpacity without nearby accessibilityLabel
          # in core payment screens (heuristic; expand as coverage grows).
          node -e "
            const fs=require('fs');const path=require('path');
            const roots=['apps/consumer-app/src/screens'];
            const files=[];
            function walk(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name);if(e.isDirectory())walk(p);else if(/\\.(tsx|jsx)$/.test(e.name))files.push(p);}}
            roots.forEach(walk);
            let warn=0;
            for(const f of files){
              const t=fs.readFileSync(f,'utf8');
              const pressables=(t.match(/<(Pressable|TouchableOpacity)\\b/g)||[]).length;
              const labels=(t.match(/accessibilityLabel=/g)||[]).length;
              if(pressables>0 && labels===0 && /Payment|Send|Shield|Wallet|Home|Onramp|Privacy/i.test(f)){
                console.warn('A11Y smoke: no accessibilityLabel in', f, '(pressables=',pressables,')');
                warn++;
              }
            }
            if(warn>5){console.error('A11Y smoke failed:',warn,'core screens lack any accessibilityLabel');process.exit(1);}
            console.log('A11Y smoke ok (warnings=',warn,')');
          "

      - name: Typecheck consumer app
        run: pnpm --filter consumer-app typecheck

      - name: Test consumer app
        run: pnpm --filter consumer-app test -- --coverage --passWithNoTests --coverageThreshold='{"global":{"lines":60,"functions":60,"branches":50,"statements":60}}'

      # UX-002: keep onboarding + send Maestro flows wired to real testIDs.
      # Full device runs still need an emulator + APK; this gate is the CI half.
      - name: Validate Maestro flows (onboarding + send)
        run: node scripts/validate-maestro-flows.mjs

      # Security scanning — DEV-001.
      #
      # This monorepo is pnpm-only (pnpm-lock.yaml). `better-npm-audit` shells
      # out to `npm audit`, which requires package-lock.json and fails with
      # ENOLOCK here. Gate with `pnpm audit` instead, and pin/force-upgrade
      # known high/critical transitive issues via root package.json#pnpm.overrides.
      #
      # Optional escape hatch: pass advisory IDs to ignore when a fix is not
      # yet available, e.g. `pnpm audit --audit-level=high --ignore 123456`.
      # Document any permanent ignore in `.nsprc.example` (or a future `.nsprc`
      # consumer script) with rationale + expiry — do not silently drop the gate.
      - name: Audit dependencies (fail on high/critical)
        run: pnpm audit --audit-level=high

  contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run contract tests
        working-directory: packages/contracts-evm
        run: forge test -vvv

      - name: Check contract sizes
        working-directory: packages/contracts-evm
        run: forge build --sizes
