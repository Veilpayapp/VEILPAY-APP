name: Consumer App EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck consumer app
        run: pnpm --filter consumer-app typecheck

      - name: Test consumer app
        run: pnpm --filter consumer-app test

  eas-build:
    needs: typecheck-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # DEV-001 fix: pin EAS CLI via `npx -p eas-cli@<version>` instead of
      # `npm install -g eas-cli`. A global install bypasses the lockfile and
      # makes the build non-reproducible. The `-p` flag pins the package;
      # `eas` is the binary name exposed by the `eas-cli` package. Bump the
      # pinned major version deliberately in a dedicated commit.
      #
      # v20 (current major) is the floor required for Expo SDK 55 — the
      # previously pinned v13 targets SDK 49-50 and crashes on the SDK 55
      # build profile format. Bumping to v20 keeps the build reproducible
      # and matches consumer-app's `expo@~55.0.27`.
      - name: EAS Build
        working-directory: apps/consumer-app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          profile="${{ github.event.inputs.profile || 'preview' }}"
          npx -p eas-cli@20 eas build --platform android --profile "$profile" --non-interactive --no-wait
