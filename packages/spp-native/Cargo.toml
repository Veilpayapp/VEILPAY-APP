[package]
name = "spp-native"
version = "0.1.0"
edition = "2021"
publish = false
description = "VeilPay native FFI for Stellar Private Payments (derive + pool ops)"
license = "Apache-2.0"

[lib]
name = "spp_native"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["derive-keys"]
# Enable when building libspp_native.so for Android (cargo-ndk). Pulls in jni.
android-jni = ["dep:jni", "dep:jni22"]
# Poseidon2 key derive + ASP leaf (matches SPP CLI / sdk/prover).
derive-keys = []
# Link stellar-private-payments-sdk (sdk/pool) for real prove/submit.
# Default EAS preview builds do NOT enable this (OTA-safe derive/ASP-only .so).
# Device APK with CAP_POOL_OPS: set SPP_NATIVE_POOL_OPS=1 on the EAS build.
# Requires packages/vendor/spp in the archive + wasmer/ark-circom NDK green.
# rustls: same as CLI — sdk/stellar uses reqwest without TLS; binary must enable it.
pool-ops = ["dep:stellar-private-payments-sdk", "dep:parking_lot", "dep:reqwest"]

[dependencies]
jni = { version = "0.21", optional = true, default-features = false }
# rustls-platform-verifier 0.7 uses jni 0.22 on Android. Keep the existing JNI
# bridge on 0.21 and use this renamed dependency only for verifier init.
jni22 = { package = "jni", version = "0.22.4", optional = true, default-features = false }
# Key derive / ASP leaf (aligned with packages/vendor/spp sdk/prover)
ark-bn254 = { version = "0.6.0", default-features = false, features = ["curve"] }
ark-ff = { version = "0.6.0", default-features = false }
ark-serialize = { version = "0.6.0", default-features = false }
sha2 = "0.10"
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets"] }
# Single zkhash path (must match sdk/pool workspace) — avoids lockfile collision.
# EAS without submodule: eas-hooks copy vendor/poseidon2 → packages/vendor/spp/poseidon2.
# Offline fallback copy kept at packages/spp-native/vendor/poseidon2 for the hook.
zkhash = { path = "../vendor/spp/poseidon2" }
num-bigint = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = { version = "0.12", optional = true }
# Same as CLI: sdk/pool blocking PrivatePool
stellar-private-payments-sdk = { path = "../vendor/spp/sdk/pool", optional = true }
# Pull rustls TLS for HTTPS Soroban RPC (sdk/stellar depends on reqwest sans TLS).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
# Direct Android init is required before rustls-platform-verifier can verify HTTPS
# Soroban RPC certificates through the Android platform trust manager.
rustls-platform-verifier = "0.7.0"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
